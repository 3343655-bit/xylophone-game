<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🎵 彩虹木琴</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  font-family:'Segoe UI','Arial Rounded MT Bold',Arial,sans-serif;
  user-select:none;
  background: linear-gradient(135deg,#0d0030 0%,#0a1a50 45%,#001a10 100%);
}

/* ── Stars ── */
#stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star {
  position:absolute; background:#fff; border-radius:50%;
  animation:twinkle var(--d) ease-in-out infinite; opacity:0;
}
@keyframes twinkle {
  0%,100%{opacity:0;transform:scale(.5)}
  50%{opacity:var(--o);transform:scale(1)}
}

/* ── Layout: sidebar + main ── */
#app {
  position:relative; z-index:1;
  width:100%; height:100%;
  display:flex; flex-direction:row;
}

/* ── Sidebar ── */
#sidebar {
  width:220px; min-width:180px;
  height:100%;
  display:flex; flex-direction:column;
  padding:16px 12px;
  gap:14px;
  background:rgba(255,255,255,0.05);
  border-right:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(12px);
  overflow-y:auto;
}

.title {
  font-size:1.5rem; font-weight:900; letter-spacing:1px;
  text-align:center;
  background:linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:titleFloat 3s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes titleFloat {
  0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}
}

.section-label {
  font-size:.7rem; font-weight:700; letter-spacing:1.5px;
  color:rgba(255,255,255,0.45); text-transform:uppercase;
  margin-bottom:2px;
}

.mode-bar { display:flex; flex-direction:column; gap:7px; }
.mode-btn {
  padding:9px 14px; border-radius:50px;
  border:2px solid rgba(255,255,255,0.25);
  background:rgba(255,255,255,0.08);
  color:#fff; font-size:.85rem; font-weight:700;
  cursor:pointer; transition:all .2s; text-align:left;
}
.mode-btn:hover { background:rgba(255,255,255,0.18); transform:translateX(3px); }
.mode-btn.active {
  background:rgba(255,255,255,0.92); color:#0d0030;
  border-color:#fff; box-shadow:0 0 16px rgba(255,255,255,0.4);
}

/* song list */
#songPanel { display:none; flex-direction:column; gap:6px; }
#songPanel.visible { display:flex; }
.song-btn {
  padding:8px 12px; border-radius:14px;
  border:2px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.06);
  color:#fff; font-size:.8rem; font-weight:600;
  cursor:pointer; transition:all .2s; text-align:left;
  line-height:1.3;
}
.song-btn:hover { background:rgba(255,255,255,0.16); }
.song-btn.active { background:rgba(255,210,60,.35); border-color:#ffd93d; }

/* play btn */
#playBtn {
  padding:11px; border-radius:50px; border:none;
  background:linear-gradient(135deg,#ffd93d,#ff6b6b);
  color:#fff; font-size:1rem; font-weight:900;
  cursor:pointer; transition:all .2s;
  box-shadow:0 3px 16px rgba(255,100,100,.45);
}
#playBtn:hover { transform:scale(1.05); }
#playBtn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

/* guide strip in sidebar */
#guideDisplay {
  display:flex; flex-direction:column; gap:6px;
  align-items:center;
}
.guide-note {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:900; color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  transform:scale(.8); opacity:.35; transition:all .2s;
}
.guide-note.current {
  transform:scale(1.2); opacity:1;
  animation:guidePulse .5s ease-in-out infinite alternate;
}
.guide-note.done { opacity:.15; transform:scale(.65); }
@keyframes guidePulse {
  from { box-shadow:0 3px 10px rgba(0,0,0,.3),0 0 0 0 rgba(255,255,255,.4); }
  to   { box-shadow:0 3px 10px rgba(0,0,0,.3),0 0 0 10px rgba(255,255,255,0); }
}

#statusMsg {
  font-size:.85rem; font-weight:700;
  color:#ffd93d; text-shadow:0 0 12px rgba(255,217,61,.6);
  text-align:center; min-height:2.4rem;
  line-height:1.3;
}

/* keyboard hint */
.kbd-hint {
  font-size:.65rem; color:rgba(255,255,255,.3);
  text-align:center; line-height:1.6;
  margin-top:auto; padding-top:8px;
}

/* ── Main area ── */
#main {
  flex:1; height:100%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:20px 30px 20px 20px;
  gap:10px;
  position:relative;
}

/* ── Xylophone: horizontal, keys side-by-side ── */
#xylophone {
  display:flex;
  flex-direction:row;
  align-items:flex-end;   /* keys grow downward from a common top edge is handled via margin-top */
  justify-content:center;
  gap:clamp(5px,1vw,12px);
  padding:30px 30px 30px;
  background:rgba(255,255,255,0.04);
  border-radius:28px;
  border:2px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  position:relative;
  width:100%;
  max-width:900px;
}

/* wooden rails top and bottom */
#xylophone::before, #xylophone::after {
  content:'';
  position:absolute; left:18px; right:18px; height:14px;
  border-radius:7px;
  background:linear-gradient(90deg,#7a4a1e 0%,#a0622a 40%,#7a4a1e 100%);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.2), 0 3px 8px rgba(0,0,0,.4);
}
#xylophone::before { top:10px; }
#xylophone::after  { bottom:10px; }

.key-wrap {
  display:flex; flex-direction:column; align-items:center;
  gap:7px; position:relative; z-index:1;
}
.key-label {
  font-size:clamp(.6rem,1.2vw,.85rem); font-weight:800;
  color:rgba(255,255,255,.92);
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.key {
  border-radius:10px 10px 14px 14px;
  cursor:pointer; position:relative;
  transition:transform .08s, filter .08s;
  box-shadow:
    0 6px 0 rgba(0,0,0,.35),
    0 8px 18px rgba(0,0,0,.3),
    inset 0 2px 5px rgba(255,255,255,.35),
    inset 0 -2px 5px rgba(0,0,0,.2);
  touch-action:manipulation;
}
.key::after {
  content:'';
  position:absolute; top:8px; left:15%; width:70%; height:28%;
  background:linear-gradient(180deg,rgba(255,255,255,.38) 0%,transparent 100%);
  border-radius:5px; pointer-events:none;
}
.key::before {
  content:'● ●';
  position:absolute; bottom:8px; width:100%;
  text-align:center; font-size:6px;
  color:rgba(0,0,0,.28); letter-spacing:3px; pointer-events:none;
}
.key:active, .key.pressed {
  transform:translateY(5px) scaleY(.95)!important;
  box-shadow:0 1px 0 rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.3),inset 0 2px 5px rgba(0,0,0,.2)!important;
  filter:brightness(1.4)!important;
}
.key.highlight {
  animation:keyHL .38s ease-in-out infinite alternate;
}
@keyframes keyHL {
  from { filter:brightness(1.1); box-shadow:0 6px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.3),inset 0 2px 5px rgba(255,255,255,.35),0 0 18px rgba(255,255,255,.25); }
  to   { filter:brightness(1.6); box-shadow:0 6px 0 rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.3),inset 0 2px 5px rgba(255,255,255,.35),0 0 38px rgba(255,255,255,.6); }
}

/* ── Particles ── */
.note-particle {
  position:fixed; pointer-events:none; font-size:1.7rem;
  animation:noteFloat 1.2s ease-out forwards; z-index:200;
}
@keyframes noteFloat {
  0%   { opacity:1; transform:translate(-50%,-50%) scale(.5) rotate(-10deg); }
  30%  { opacity:1; transform:translate(calc(-50% + var(--dx)),calc(-50% - 38px)) scale(1.3) rotate(8deg); }
  100% { opacity:0; transform:translate(calc(-50% + var(--dx)),calc(-50% - 95px)) scale(.8) rotate(var(--rot)); }
}
.ripple {
  position:fixed; border-radius:50%; pointer-events:none;
  animation:rippleOut .55s ease-out forwards; z-index:199;
}
@keyframes rippleOut {
  0%  { transform:translate(-50%,-50%) scale(0); opacity:.65; }
  100%{ transform:translate(-50%,-50%) scale(3); opacity:0; }
}

/* ── Progress bar ── */
#progressWrap {
  width:100%; max-width:900px;
  height:8px; background:rgba(255,255,255,0.1);
  border-radius:4px; overflow:hidden;
  display:none;
}
#progressBar {
  height:100%; width:0%;
  background:linear-gradient(90deg,#ffd93d,#ff6b6b);
  border-radius:4px;
  transition:width .2s;
}
</style>
</head>
<body>
<div id="stars"></div>

<div id="app">
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="title">🎵 彩虹木琴</div>

    <div>
      <div class="section-label">模式</div>
      <div class="mode-bar">
        <button class="mode-btn active" id="btnFree"  onclick="setMode('free')">🎹 自由彈奏</button>
        <button class="mode-btn"        id="btnGuide" onclick="setMode('guide')">🌟 跟我彈</button>
      </div>
    </div>

    <div id="songPanel">
      <div class="section-label">選歌曲</div>
      <!-- songs injected by JS -->
    </div>

    <button id="playBtn" style="display:none" onclick="startGuide()">▶ 開始！</button>

    <div id="guideArea" style="display:none">
      <div class="section-label" style="text-align:center;margin-bottom:6px;">下一個音</div>
      <div id="guideDisplay"></div>
    </div>

    <div id="statusMsg"></div>

    <div class="kbd-hint">
      鍵盤：A S D F J K L ;<br>對應 Do Re Mi Fa Sol La Si Do²
    </div>
  </div>

  <!-- Main stage -->
  <div id="main">
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="xylophone"></div>
  </div>
</div>

<script>
// ── Audio ──────────────────────────────────────────────────────────────────
let ctx = null;
function ensureCtx(){
  if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
}
function playTone(freq){
  ensureCtx();
  const now = ctx.currentTime;
  const o1=ctx.createOscillator(), o2=ctx.createOscillator();
  const g1=ctx.createGain(),       g2=ctx.createGain();
  const master=ctx.createGain();
  o1.type='sine'; o2.type='triangle';
  o1.frequency.value=freq; o2.frequency.value=freq*2.01;
  g1.gain.setValueAtTime(.7,now); g1.gain.exponentialRampToValueAtTime(.001,now+1.5);
  g2.gain.setValueAtTime(.18,now); g2.gain.exponentialRampToValueAtTime(.001,now+.6);
  master.gain.value=.5;
  o1.connect(g1); g1.connect(master);
  o2.connect(g2); g2.connect(master);
  master.connect(ctx.destination);
  o1.start(now); o1.stop(now+1.6);
  o2.start(now); o2.stop(now+.7);
}

// ── Keys definition ────────────────────────────────────────────────────────
const KEYS=[
  {label:'Do', freq:523.25, color:'#FF4757', dark:'#b71c1c'},
  {label:'Re', freq:587.33, color:'#FF8C00', dark:'#e65100'},
  {label:'Mi', freq:659.25, color:'#FFD700', dark:'#f57f17'},
  {label:'Fa', freq:698.46, color:'#00C853', dark:'#1b5e20'},
  {label:'Sol',freq:784.00, color:'#2196F3', dark:'#0d47a1'},
  {label:'La', freq:880.00, color:'#9C27B0', dark:'#4a148c'},
  {label:'Si', freq:987.77, color:'#E91E8C', dark:'#880E4F'},
  {label:'Do²',freq:1046.5, color:'#FF4757', dark:'#b71c1c'},
];
// Widths base (px) — all keys same width; heights decrease left→right (Do tallest)
const WIDTHS_BASE = [72,72,72,72,72,72,72,72];
const HEIGHTS_BASE= [220,202,186,172,158,146,135,124];

function buildXylophone(){
  const el=document.getElementById('xylophone');
  el.innerHTML='';
  const scale = Math.min(1, (window.innerHeight-160)/240, (window.innerWidth-250)/680);
  KEYS.forEach((k,i)=>{
    const W=Math.round(WIDTHS_BASE[i]*scale);
    const H=Math.round(HEIGHTS_BASE[i]*scale);
    const wrap=document.createElement('div');
    wrap.className='key-wrap';
    const lbl=document.createElement('div');
    lbl.className='key-label'; lbl.textContent=k.label;
    const key=document.createElement('div');
    key.className='key'; key.id='key-'+i;
    key.style.cssText=`width:${W}px;height:${H}px;background:linear-gradient(160deg,${k.color} 0%,${k.dark} 100%);`;
    key.addEventListener('pointerdown',e=>{e.preventDefault();pressKey(i);});
    wrap.appendChild(lbl); wrap.appendChild(key);
    el.appendChild(wrap);
  });
}

function pressKey(i){
  playTone(KEYS[i].freq);
  animKey(i); spawnParticles(i);
  if(mode==='guide'&&guideActive) checkGuideNote(i);
}
function animKey(i){
  const el=document.getElementById('key-'+i); if(!el)return;
  el.classList.add('pressed'); setTimeout(()=>el.classList.remove('pressed'),140);
}

// ── Particles ──────────────────────────────────────────────────────────────
const PCHARS=['♩','♪','♫','♬','🎵','🎶','⭐','✨'];
function spawnParticles(i){
  const keyEl=document.getElementById('key-'+i); if(!keyEl)return;
  const r=keyEl.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/3;
  const rip=document.createElement('div'); rip.className='ripple';
  rip.style.cssText=`left:${cx}px;top:${cy}px;width:60px;height:60px;background:${KEYS[i].color};`;
  document.body.appendChild(rip); setTimeout(()=>rip.remove(),650);
  for(let n=0;n<3;n++){
    const p=document.createElement('div'); p.className='note-particle';
    const dx=(Math.random()-.5)*80, rot=(Math.random()*60-30)+'deg';
    p.style.cssText=`left:${cx}px;top:${cy}px;--dx:${dx}px;--rot:${rot};color:${KEYS[i].color};`;
    p.textContent=PCHARS[Math.floor(Math.random()*PCHARS.length)];
    document.body.appendChild(p); setTimeout(()=>p.remove(),1300);
  }
}

// ── Songs ──────────────────────────────────────────────────────────────────
// Index: 0=Do 1=Re 2=Mi 3=Fa 4=Sol 5=La 6=Si 7=Do²
const SONGS=[
  { name:'⭐ 小星星',      emoji:'⭐',
    notes:[0,0,4,4,5,5,4, 3,3,2,2,1,1,0, 4,4,3,3,2,2,1, 4,4,3,3,2,2,1, 0,0,4,4,5,5,4, 3,3,2,2,1,1,0] },
  { name:'🎂 生日快樂',    emoji:'🎂',
    notes:[4,4,5,4,0,6, 4,4,5,4,1,0, 4,4,7,5,3,2,1, 6,6,5,3,4,0] },
  { name:'🐑 瑪莉小羊',    emoji:'🐑',
    notes:[2,1,0,1,2,2,2, 1,1,1, 2,4,4, 2,1,0,1,2,2,2, 1,1,2,1,0] },
  { name:'🐸 青蛙歌',      emoji:'🐸',
    notes:[0,1,2,0, 0,1,2,0, 2,3,4, 2,3,4, 4,5,4,3,2,0, 4,5,4,3,2,0, 0,4,0, 0,4,0] },
  { name:'🎠 倫敦鐵橋',   emoji:'🎠',
    notes:[4,5,4,3,2,3,4, 1,2,3,2,3,4, 4,5,4,3,2,3,4, 1,4,2,0] },
  { name:'🐻 小熊維尼',    emoji:'🐻',
    notes:[0,0,0,4, 3,2,1,0, 2,2,2,5, 4,3,2,1, 0,0,4,4,5, 4,3,2, 0,1,2,1,0] },
  { name:'🌊 划船歌',      emoji:'🌊',
    notes:[0,0,0,1,2, 2,1,2,3,4, 7,7,7,4,4,4,2,2,2,0,0,0, 4,3,2,1,0] },
  { name:'🎅 鈴兒響叮噹',  emoji:'🎅',
    notes:[2,2,2, 2,2,2, 2,4,0,1,2, 3,3,3,3, 3,2,2,2, 2,1,1,2,1, 4,
           2,2,2, 2,2,2, 2,4,0,1,2, 3,3,3,3, 3,2,2,2, 4,4,3,1,0] },
  { name:'🌹 玫瑰玫瑰',    emoji:'🌹',
    notes:[0,1,2,0, 0,1,2,0, 2,3,4, 2,3,4, 4,5,4,3,2,0, 4,5,4,3,2,0, 0,5,0, 0,5,0] },
  { name:'🐣 小蜜蜂',      emoji:'🐣',
    notes:[4,3,2,3,4,4,4, 3,3,3, 4,5,5, 4,3,2,3,4,4,4, 3,3,4,3,2] },
];

let currentSong=0;

function buildSongList(){
  const panel=document.getElementById('songPanel');
  // remove old buttons but keep label
  panel.querySelectorAll('.song-btn').forEach(b=>b.remove());
  SONGS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='song-btn'+(i===0?' active':'');
    b.textContent=s.name;
    b.onclick=()=>selectSong(i);
    panel.appendChild(b);
  });
}

function selectSong(i){
  currentSong=i;
  document.querySelectorAll('.song-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  stopGuide(); renderGuide(); setStatus('');
}

// ── Mode ───────────────────────────────────────────────────────────────────
let mode='free';
function setMode(m){
  mode=m;
  document.getElementById('btnFree').classList.toggle('active',m==='free');
  document.getElementById('btnGuide').classList.toggle('active',m==='guide');
  const sp=document.getElementById('songPanel');
  const pb=document.getElementById('playBtn');
  const ga=document.getElementById('guideArea');
  const pw=document.getElementById('progressWrap');
  sp.classList.toggle('visible',m==='guide');
  pb.style.display=m==='guide'?'block':'none';
  ga.style.display=m==='guide'?'block':'none';
  pw.style.display=m==='guide'?'block':'none';
  if(m==='guide'){stopGuide();renderGuide();setStatus('');}
  else{stopGuide();document.getElementById('guideDisplay').innerHTML='';setStatus('');updateProgress(0,1);}
}
function setStatus(msg){document.getElementById('statusMsg').textContent=msg;}

// ── Guide ──────────────────────────────────────────────────────────────────
let guideActive=false, guideIdx=0;

function updateProgress(cur,total){
  const pct=total>0?Math.round(cur/total*100):0;
  document.getElementById('progressBar').style.width=pct+'%';
}

function renderGuide(){
  const song=SONGS[currentSong];
  const disp=document.getElementById('guideDisplay');
  const start=Math.max(0,guideIdx-1);
  const slice=song.notes.slice(start,start+5);
  disp.innerHTML=slice.map((n,si)=>{
    const abs=start+si;
    let cls='';
    if(abs<guideIdx) cls='done';
    else if(abs===guideIdx) cls='current';
    const k=KEYS[n];
    return `<div class="guide-note ${cls}" style="background:${k.color}">${k.label}</div>`;
  }).join('');
  updateProgress(guideIdx, song.notes.length);
}

function startGuide(){
  guideActive=true; guideIdx=0;
  document.getElementById('playBtn').disabled=true;
  renderGuide();
  setStatus(`彈 ${KEYS[SONGS[currentSong].notes[0]].label} 吧！`);
  highlightCurrentKey();
}
function highlightCurrentKey(){
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('highlight'));
  if(!guideActive)return;
  const song=SONGS[currentSong];
  if(guideIdx>=song.notes.length)return;
  const el=document.getElementById('key-'+song.notes[guideIdx]);
  if(el)el.classList.add('highlight');
}
function checkGuideNote(i){
  if(!guideActive)return;
  const song=SONGS[currentSong];
  const exp=song.notes[guideIdx];
  if(i===exp){
    guideIdx++;
    document.getElementById('key-'+i)?.classList.remove('highlight');
    if(guideIdx>=song.notes.length){
      guideActive=false;
      document.querySelectorAll('.key').forEach(k=>k.classList.remove('highlight'));
      setStatus('🎉 太棒了！整首彈完了！');
      document.getElementById('playBtn').disabled=false;
      document.getElementById('guideDisplay').innerHTML='';
      updateProgress(song.notes.length,song.notes.length);
      celebrate();
    } else {
      renderGuide();
      setStatus(`很好！彈 ${KEYS[song.notes[guideIdx]].label} 吧！`);
      highlightCurrentKey();
    }
  } else {
    const el=document.getElementById('key-'+i);
    if(el){
      el.style.transform='translateX(-5px)';
      setTimeout(()=>{el.style.transform='translateX(5px)';},80);
      setTimeout(()=>{el.style.transform='';},160);
    }
    setStatus(`再試試！彈 ${KEYS[exp].label} 哦～`);
  }
}
function stopGuide(){
  guideActive=false;
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('highlight'));
  document.getElementById('playBtn').disabled=false;
}

function celebrate(){
  const chars=['🎵','🎶','⭐','🌟','✨','🎉','🎊','🎈'];
  for(let i=0;i<35;i++){
    setTimeout(()=>{
      const p=document.createElement('div'); p.className='note-particle';
      const x=Math.random()*window.innerWidth, y=Math.random()*window.innerHeight;
      const dx=(Math.random()-.5)*120, rot=(Math.random()*80-40)+'deg';
      p.style.cssText=`left:${x}px;top:${y}px;--dx:${dx}px;--rot:${rot};font-size:2.2rem;`;
      p.textContent=chars[Math.floor(Math.random()*chars.length)];
      document.body.appendChild(p); setTimeout(()=>p.remove(),1400);
    },i*70);
  }
}

// ── Stars ──────────────────────────────────────────────────────────────────
function buildStars(){
  const el=document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('div'); s.className='star';
    const size=Math.random()*2.5+1;
    s.style.cssText=`width:${size}px;height:${size}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --d:${(Math.random()*3+2)}s;--o:${Math.random()*.6+.3};
      animation-delay:${Math.random()*5}s;`;
    el.appendChild(s);
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
buildStars();
buildSongList();
buildXylophone();
window.addEventListener('resize',buildXylophone);

const KEY_MAP={'a':0,'s':1,'d':2,'f':3,'j':4,'k':5,'l':6,';':7};
document.addEventListener('keydown',e=>{
  const i=KEY_MAP[e.key.toLowerCase()];
  if(i!==undefined) pressKey(i);
});
</script>
